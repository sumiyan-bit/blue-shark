# Checagem automática: roda em todo Pull Request.
# A main só aceita mudança se esta checagem passar (proteção da main).
name: Site

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checagem:
    name: Checagem (segredos, lint e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nada de .env, chaves ou certificados
        run: |
          proibidos=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[^e]|\.(pem|key|p12|pfx)$' || true)
          if [ -n "$proibidos" ]; then
            echo "Arquivos que não podem ir para o repositório:"
            echo "$proibidos"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
